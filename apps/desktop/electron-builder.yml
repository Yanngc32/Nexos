# Config do electron-builder — gera o instalador Windows (NSIS) e publica no GitHub Releases,
# que é de onde o electron-updater (ver main.cjs) lê a versão mais nova em produção.
# Ver docs/RELEASE.md pro processo de corte de release.
appId: br.com.2dconsultores.nexo
productName: Nexo
directories:
  output: dist
files:
  - "**/*"
  - "!test/**"
  - "!dist/**"
  - "!daemon-dist/**"
  - "!**/*.test.js"
# O daemon roda como processo filho do main, no PRÓPRIO binário do Electron em modo Node
# (ELECTRON_RUN_AS_NODE — ver spawnNexo em main.cjs), então não depende de Node instalado na
# máquina de quem instala. `daemon-dist` é gerado por `pnpm run deploy:daemon` (script `predeploy`
# do `build`/`build:publish`): `pnpm deploy` resolve `@nexo/shared` (workspace:*) pra uma cópia de
# verdade dentro do próprio `node_modules` do deploy, em vez do symlink pro monorepo que não
# existe na máquina de quem instala. `tsx` é dependency (não devDependency) do daemon por isso —
# precisa ir junto do `--prod` do deploy pra interpretar o TypeScript em runtime.
extraResources:
  - from: daemon-dist
    to: daemon
win:
  target: nsis
  icon: icons/app.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: Yanngc32
  repo: Nexos
  # Sem isto o electron-builder publica a release como RASCUNHO (draft) — invisível em
  # /releases/latest, e é exatamente o que o electron-updater consulta (ver main.cjs). A
  # release de v0.1.0 saiu em draft e precisou ser publicada à mão; isto evita repetir.
  releaseType: release
