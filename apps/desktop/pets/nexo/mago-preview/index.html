<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexo — maguinho</title>
    <style>
      :root {
        --bg: #181818;
        --dock: #141414;
        --elev: #2b2b2b;
        --line: #333;
        --cream: #ddd6c5;
        --gem: #4d9cd6;
        --muted: #8d8d8d;
        --text: #e8e8e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, monospace;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100%;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
        gap: 28px;
        align-items: center;
        min-height: 0;
        padding: 20px 24px;
      }

      .zoom-wrap {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 8px;
        min-height: 0;
        height: 100%;
        overflow: auto;
      }

      .zoom-wrap span {
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: lowercase;
      }

      #zoom {
        display: block;
        flex-shrink: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #0a0a0c;
        border: 1px solid var(--line);
      }

      /*
       * Pés (ou a aba do chapéu, no off) colam no topo da box.
       * O canvas termina na linha de contato: bottom = topo da caixa.
       * Nunca padding embaixo do sprite — isso flutua. Nunca desenhar
       * em cima da box — isso atravessa.
       */
      .perch {
        position: relative;
        width: 100%;
      }

      #sprite {
        position: absolute;
        right: 20px;
        bottom: 100%;
        display: block;
        height: 96px;
        width: auto;
        image-rendering: pixelated;
        pointer-events: none;
        user-select: none;
      }

      .box {
        min-height: 108px;
        padding: 14px 16px 40px;
        background: var(--elev);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--muted);
      }

      .box p {
        margin: 0;
      }

      .dock {
        border-top: 1px solid #2a2a2a;
        background: var(--dock);
        padding: 14px 20px 18px;
        display: grid;
        gap: 12px;
      }

      .status {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: lowercase;
      }

      .status b {
        color: var(--cream);
        font-weight: 600;
      }

      .status[data-pose="work"] b {
        color: var(--gem);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      button {
        appearance: none;
        border: 1px solid #2a2a2a;
        background: transparent;
        color: var(--muted);
        font: inherit;
        padding: 6px 10px;
        border-radius: 999px;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        color: var(--text);
        border-color: #444;
        outline: none;
      }

      button[aria-pressed="true"] {
        color: var(--bg);
        background: var(--cream);
        border-color: var(--cream);
      }

      button.tour[aria-pressed="true"] {
        background: var(--gem);
        border-color: var(--gem);
        color: #081018;
      }

      @media (max-width: 800px) {
        .stage {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="zoom-wrap">
        <span id="zoom-label">lupa · 8×</span>
        <canvas id="zoom" width="1" height="1" aria-label="Maguinho aumentado"></canvas>
      </div>
      <div class="perch">
        <canvas id="sprite" width="1" height="1" aria-label="Maguinho no canto do compositor"></canvas>
        <div class="box">
          <p>Pergunta, pede mudança, ou descreve o que fazer…</p>
        </div>
      </div>
    </main>

    <footer class="dock">
      <div class="status" id="status" data-pose="off">
        <span>nexo · maguinho</span>
        <span>motor: <b id="label">desligado</b></span>
      </div>
      <div class="row">
        <button type="button" data-pose="off" aria-pressed="true">off</button>
        <button type="button" data-pose="idle" aria-pressed="false">idle</button>
        <button type="button" data-pose="work" aria-pressed="false">work</button>
        <button type="button" class="tour" id="tour" aria-pressed="true">tour</button>
        <span class="hint">espaço pausa · ← → passo</span>
      </div>
    </footer>

    <script>
      const SRC = {
        off: "off.png",
        idle: "idle.png",
        work: "work.png",
      };
      const LABEL = {
        off: "desligado",
        idle: "ligado",
        work: "escrevendo",
      };

      const sprite = document.getElementById("sprite");
      const zoom = document.getElementById("zoom");
      const zoomLabel = document.getElementById("zoom-label");
      const status = document.getElementById("status");
      const label = document.getElementById("label");
      const tourBtn = document.getElementById("tour");
      const poseBtns = [...document.querySelectorAll("[data-pose]")];
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let pose = "off";
      let run = "off";
      let tour = !reduce;
      let timer = 0;
      let beat = 0;
      const cache = new Map();

      const TOUR = [
        ["off", 700],
        ["off-z1", 700],
        ["off-z2", 700],
        ["off-z1", 700],
        ["off", 900],
        ["idle", 1600],
        ["idle-in1", 160],
        ["idle-in2", 160],
        ["idle-hide", 700],
        ["idle-in2", 160],
        ["idle-in1", 180],
        ["idle", 1200],
        ["idle-blink", 140],
        ["idle", 900],
        ["work", 180],
        ["work-tap-a", 90],
        ["work-on", 110],
        ["work-tap-b", 90],
        ["work-dim", 80],
        ["work-tap-a-on", 90],
        ["work-logo", 90],
        ["work-tap-b", 90],
        ["work-blink", 120],
        ["work-tap-a", 90],
        ["work", 160],
        ["idle", 1400],
      ];

      function isBg(r, g, b) {
        return r + g + b < 60;
      }

      function isBar(r, g, b) {
        const avg = (r + g + b) / 3;
        const spread = Math.max(r, g, b) - Math.min(r, g, b);
        return !isBg(r, g, b) && avg <= 95 && spread < 20;
      }

      function isSprite(r, g, b) {
        return !isBg(r, g, b) && !isBar(r, g, b);
      }

      function cloneSheet(sheet) {
        const c = document.createElement("canvas");
        c.width = sheet.width;
        c.height = sheet.height;
        c.getContext("2d").drawImage(sheet, 0, 0);
        return c;
      }

      function isCream(r, g, b, a) {
        return a > 200 && r > 160 && g > 140 && b > 110 && r > b + 10;
      }

      function isDark(r, g, b, a) {
        return a > 200 && r + g + b < 160;
      }

      function creamNeighbor(d, w, h, x, y) {
        for (let oy = -1; oy <= 1; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            if (!ox && !oy) continue;
            const nx = x + ox;
            const ny = y + oy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            const i = (ny * w + nx) * 4;
            if (isCream(d[i], d[i + 1], d[i + 2], d[i + 3])) return true;
          }
        }
        return false;
      }

      function isGrey(r, g, b, a) {
        if (a < 200) return false;
        const avg = (r + g + b) / 3;
        const spread = Math.max(r, g, b) - Math.min(r, g, b);
        return avg >= 70 && avg <= 180 && spread < 22;
      }

      function greyNeighbor(d, w, h, x, y) {
        for (let oy = -1; oy <= 1; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            if (!ox && !oy) continue;
            const nx = x + ox;
            const ny = y + oy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            const i = (ny * w + nx) * 4;
            if (isGrey(d[i], d[i + 1], d[i + 2], d[i + 3])) return true;
          }
        }
        return false;
      }

      /** Fecha só o olho. Chapéu, notebook e tamanho iguais. */
      function blinkSheet(sheet) {
        const c = cloneSheet(sheet);
        const ctx = c.getContext("2d");
        const img = ctx.getImageData(0, 0, c.width, c.height);
        const d = img.data;
        const w = c.width;
        const h = c.height;
        let cr = 0;
        let cg = 0;
        let cb = 0;
        let n = 0;
        const y0 = Math.floor(h * 0.55);
        const y1 = Math.floor(h * 0.91);
        let minX = w;
        let maxX = 0;
        for (let y = y0; y < y1; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (!isCream(d[i], d[i + 1], d[i + 2], d[i + 3])) continue;
            cr += d[i];
            cg += d[i + 1];
            cb += d[i + 2];
            n += 1;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
        if (!n || maxX < minX) return c;
        cr = Math.round(cr / n);
        cg = Math.round(cg / n);
        cb = Math.round(cb / n);
        const pad = Math.round((maxX - minX) * 0.22);
        const x0 = minX + pad;
        const x1 = maxX - pad;
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const i = (y * w + x) * 4;
            if (d[i + 3] < 200) continue;
            if (d[i] + d[i + 1] + d[i + 2] >= 200) continue;
            if (greyNeighbor(d, w, h, x, y)) continue;
            if (!creamNeighbor(d, w, h, x, y)) continue;
            d[i] = cr;
            d[i + 1] = cg;
            d[i + 2] = cb;
          }
        }
        ctx.putImageData(img, 0, 0);
        return c;
      }

      function creamLeft(d, w, h) {
        let minX = w;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (!isCream(d[i], d[i + 1], d[i + 2], d[i + 3])) continue;
            if (x < minX) minX = x;
          }
        }
        return minX;
      }

      function isLogo(r, g, b, a) {
        if (a < 200) return false;
        const avg = (r + g + b) / 3;
        const spread = Math.max(r, g, b) - Math.min(r, g, b);
        return avg >= 185 && avg <= 240 && spread < 45;
      }

      /** Só o logo da tampa pisca. Corpo, base e chapéu parados. */
      function pulseLaptop(sheet, delta, extra) {
        const c = cloneSheet(sheet);
        const ctx = c.getContext("2d");
        const img = ctx.getImageData(0, 0, c.width, c.height);
        const d = img.data;
        const w = c.width;
        const h = c.height;
        const hatX = creamLeft(d, w, h);
        const yBase = h - 4;
        const seen = new Uint8Array(w * h);
        const blobs = [];
        const dirs = [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
        ];
        for (let y = 0; y < yBase; y++) {
          for (let x = 0; x < hatX; x++) {
            const s = y * w + x;
            const i = s * 4;
            if (seen[s] || !isLogo(d[i], d[i + 1], d[i + 2], d[i + 3])) continue;
            const pix = [];
            const q = [[x, y]];
            seen[s] = 1;
            while (q.length) {
              const [cx, cy] = q.pop();
              pix.push([cx, cy]);
              for (const [dx, dy] of dirs) {
                const nx = cx + dx;
                const ny = cy + dy;
                if (nx < 0 || ny < 0 || nx >= hatX || ny >= yBase) continue;
                const ns = ny * w + nx;
                const ni = ns * 4;
                if (seen[ns] || !isLogo(d[ni], d[ni + 1], d[ni + 2], d[ni + 3])) continue;
                seen[ns] = 1;
                q.push([nx, ny]);
              }
            }
            blobs.push(pix);
          }
        }
        blobs.sort((a, b) => b.length - a.length);
        const logo = blobs[0] || [];
        const clamp = (v) => Math.max(0, Math.min(255, v));
        const add = delta + extra;
        for (const [x, y] of logo) {
          const i = (y * w + x) * 4;
          d[i] = clamp(d[i] + add);
          d[i + 1] = clamp(d[i + 1] + add);
          d[i + 2] = clamp(d[i + 2] + add);
        }
        ctx.putImageData(img, 0, 0);
        return c;
      }

      function opaque(d, i) {
        return d[i + 3] > 160;
      }

      function components(sheet) {
        const ctx = sheet.getContext("2d");
        const img = ctx.getImageData(0, 0, sheet.width, sheet.height);
        const d = img.data;
        const w = sheet.width;
        const h = sheet.height;
        const seen = new Uint8Array(w * h);
        const out = [];
        const dirs = [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
        ];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * w + x;
            if (seen[s] || !opaque(d, s * 4)) continue;
            const pix = [];
            const q = [[x, y]];
            seen[s] = 1;
            let minX = x;
            let minY = y;
            let maxX = x;
            let maxY = y;
            while (q.length) {
              const [cx, cy] = q.pop();
              pix.push([cx, cy]);
              if (cx < minX) minX = cx;
              if (cy < minY) minY = cy;
              if (cx > maxX) maxX = cx;
              if (cy > maxY) maxY = cy;
              for (const [dx, dy] of dirs) {
                const nx = cx + dx;
                const ny = cy + dy;
                if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                const ns = ny * w + nx;
                if (seen[ns] || !opaque(d, ns * 4)) continue;
                seen[ns] = 1;
                q.push([nx, ny]);
              }
            }
            out.push({ pix, minX, minY, maxX, maxY, area: pix.length });
          }
        }
        out.sort((a, b) => b.area - a.area);
        return { img, parts: out };
      }

      /** Z sobe. Chapéu parado. Pad só cima/esquerda: pé fica na última linha. */
      function driftZ(sheet, step) {
        const { img, parts } = components(sheet);
        if (parts.length < 2) return cloneSheet(sheet);
        const hat = parts[0];
        const zs = parts.filter((p, i) => i > 0 && p.maxY < hat.minY + (hat.maxY - hat.minY) * 0.55);
        if (!zs.length) return cloneSheet(sheet);
        const lift = step * 6;
        const padT = lift + 2;
        const padL = lift + 2;
        const c = document.createElement("canvas");
        c.width = sheet.width + padL;
        c.height = sheet.height + padT;
        const ctx = c.getContext("2d");
        const hatSheet = cloneSheet(sheet);
        const hctx = hatSheet.getContext("2d");
        const hImg = hctx.getImageData(0, 0, hatSheet.width, hatSheet.height);
        const hd = hImg.data;
        const w = hatSheet.width;
        for (const z of zs) {
          for (const [x, y] of z.pix) {
            const i = (y * w + x) * 4;
            hd[i + 3] = 0;
          }
        }
        hctx.putImageData(hImg, 0, 0);
        ctx.drawImage(hatSheet, padL, padT);
        const src = img.data;
        for (const z of zs) {
          for (const [x, y] of z.pix) {
            const i = (y * w + x) * 4;
            const nx = x + padL - lift;
            const ny = y + padT - lift;
            if (nx < 0 || ny < 0 || nx >= c.width || ny >= c.height) continue;
            ctx.fillStyle = `rgba(${src[i]},${src[i + 1]},${src[i + 2]},${src[i + 3] / 255})`;
            ctx.fillRect(nx, ny, 1, 1);
          }
        }
        return c;
      }

      function toDisplay(sheet, destH) {
        const destW = Math.max(1, Math.round((sheet.width * destH) / sheet.height));
        const c = document.createElement("canvas");
        c.width = destW;
        c.height = destH;
        const ctx = c.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sheet, 0, 0, destW, destH);
        return c;
      }

      function extract(img) {
        const src = document.createElement("canvas");
        src.width = img.naturalWidth;
        src.height = img.naturalHeight;
        const sctx = src.getContext("2d", { willReadFrequently: true });
        sctx.drawImage(img, 0, 0);
        const { data, width, height } = sctx.getImageData(0, 0, src.width, src.height);
        const at = (x, y) => {
          const i = (y * width + x) * 4;
          return [data[i], data[i + 1], data[i + 2]];
        };

        let barTop = height;
        let barHits = 0;
        for (let y = Math.floor(height * 0.3); y < height; y++) {
          let n = 0;
          for (let x = 0; x < width; x += 2) {
            const [r, g, b] = at(x, y);
            if (isBar(r, g, b)) n++;
          }
          if (n > barHits && n > width * 0.12) {
            barHits = n;
            barTop = y;
          }
        }

        let minX = width;
        let minY = height;
        let maxX = 0;
        let maxY = -1;
        const limit = Math.max(0, barTop);
        for (let y = 0; y < limit; y++) {
          for (let x = 0; x < width; x++) {
            const [r, g, b] = at(x, y);
            if (!isSprite(r, g, b)) continue;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
        if (maxY < 0) return src;

        const pad = 2;
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(width - 1, maxX + pad);
        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const out = document.createElement("canvas");
        out.width = cropW;
        out.height = cropH;
        const octx = out.getContext("2d");
        octx.drawImage(src, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        const cut = octx.getImageData(0, 0, cropW, cropH);
        const cd = cut.data;
        for (let i = 0; i < cd.length; i += 4) {
          if (isBg(cd[i], cd[i + 1], cd[i + 2]) || isBar(cd[i], cd[i + 1], cd[i + 2])) {
            cd[i + 3] = 0;
          }
        }
        octx.putImageData(cut, 0, 0);
        return out;
      }

      function show(sheet) {
        const ctx = sprite.getContext("2d");
        sprite.width = sheet.width;
        sprite.height = sheet.height;
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, sheet.width, sheet.height);
        ctx.drawImage(sheet, 0, 0);
        sprite.style.height = `${sheet.height}px`;
        sprite.style.width = `${sheet.width}px`;

        const wrap = zoom.parentElement;
        const maxH = Math.max(80, wrap.clientHeight - 36);
        const z = Math.max(1, Math.min(16, Math.floor(maxH / sheet.height)));
        zoom.width = sheet.width * z;
        zoom.height = sheet.height * z;
        zoom.style.width = `${zoom.width}px`;
        zoom.style.height = `${zoom.height}px`;
        const zctx = zoom.getContext("2d");
        zctx.imageSmoothingEnabled = false;
        zctx.fillStyle = "#0a0a0c";
        zctx.fillRect(0, 0, zoom.width, zoom.height);
        zctx.strokeStyle = "rgba(255,255,255,0.07)";
        zctx.lineWidth = 1;
        zctx.beginPath();
        for (let x = 0; x <= zoom.width; x += z) {
          zctx.moveTo(x + 0.5, 0);
          zctx.lineTo(x + 0.5, zoom.height);
        }
        for (let y = 0; y <= zoom.height; y += z) {
          zctx.moveTo(0, y + 0.5);
          zctx.lineTo(zoom.width, y + 0.5);
        }
        zctx.stroke();

        const src = sheet.getContext("2d").getImageData(0, 0, sheet.width, sheet.height).data;
        for (let y = 0; y < sheet.height; y++) {
          for (let x = 0; x < sheet.width; x++) {
            const i = (y * sheet.width + x) * 4;
            const a = src[i + 3];
            if (a < 8) continue;
            zctx.fillStyle = `rgba(${src[i]},${src[i + 1]},${src[i + 2]},${a / 255})`;
            zctx.fillRect(x * z, y * z, z, z);
          }
        }
        zoomLabel.textContent = `lupa · ${z}×`;
      }

      function poseGroup(name) {
        if (name.startsWith("off")) return "off";
        if (name.startsWith("work")) return "work";
        return "idle";
      }

      function paint(next) {
        pose = next;
        const sheet = cache.get(next);
        if (sheet) show(sheet);
        const group = poseGroup(next);
        status.dataset.pose = group;
        label.textContent = LABEL[group];
        for (const b of poseBtns) {
          b.setAttribute("aria-pressed", b.dataset.pose === group ? "true" : "false");
        }
      }

      function clearTimer() {
        clearTimeout(timer);
        timer = 0;
      }

      function after(ms, fn) {
        clearTimer();
        timer = setTimeout(fn, ms);
      }

      function still(name) {
        return run === name;
      }

      function scheduleTour() {
        clearTimer();
        if (!tour || run !== "tour") return;
        const [name, ms] = TOUR[beat % TOUR.length];
        paint(name);
        timer = setTimeout(() => {
          beat = (beat + 1) % TOUR.length;
          scheduleTour();
        }, ms);
      }

      function loopOff() {
        const seq = [
          ["off", 800],
          ["off-z1", 700],
          ["off-z2", 700],
          ["off-z1", 700],
        ];
        let i = 0;
        function tick() {
          if (!still("off")) return;
          const [name, ms] = seq[i % seq.length];
          paint(name);
          i += 1;
          after(ms, tick);
        }
        tick();
      }

      function loopBlink(group) {
        const rest = group;
        const shut = `${group}-blink`;
        const holdMin = group === "work" ? 900 : 2000;
        const holdSpan = group === "work" ? 1600 : 2800;

        function hold() {
          if (!still(group)) return;
          paint(rest);
          after(holdMin + Math.random() * holdSpan, blink);
        }

        function blink() {
          if (!still(group)) return;
          paint(shut);
          after(120, () => {
            if (!still(group)) return;
            if (Math.random() < 0.22) {
              paint(rest);
              after(90, () => {
                if (!still(group)) return;
                paint(shut);
                after(100, hold);
              });
            } else hold();
          });
        }

        hold();
      }

      function loopIdle() {
        function rest() {
          if (!still("idle")) return;
          if (Math.random() < 0.34) {
            playHide();
            return;
          }
          paint("idle");
          after(1800 + Math.random() * 2200, () => {
            if (!still("idle")) return;
            paint("idle-blink");
            after(120, rest);
          });
        }
        function playHide() {
          const seq = [
            ["idle-in1", 160],
            ["idle-in2", 160],
            ["idle-hide", 720],
            ["idle-in2", 160],
            ["idle-in1", 180],
            ["idle", 400],
          ];
          let i = 0;
          function step() {
            if (!still("idle")) return;
            if (i >= seq.length) {
              rest();
              return;
            }
            const [name, ms] = seq[i];
            i += 1;
            paint(name);
            after(ms, step);
          }
          step();
        }
        paint("idle");
        after(700, rest);
      }

      function loopWork() {
        const seq = [
          ["work", 150],
          ["work-tap-a", 90],
          ["work-on", 90],
          ["work-tap-b", 90],
          ["work-dim", 80],
          ["work-tap-a-on", 90],
          ["work", 120],
          ["work-tap-b", 80],
          ["work-logo", 80],
          ["work-tap-a", 90],
          ["work-blink", 120],
          ["work-tap-b-on", 90],
          ["work-on", 70],
          ["work-dim", 60],
        ];
        let i = 0;
        function tick() {
          if (!still("work")) return;
          const [name, ms] = seq[i % seq.length];
          paint(name);
          i += 1;
          after(ms, tick);
        }
        tick();
      }

      function start(name) {
        clearTimer();
        if (name === "tour") {
          run = "tour";
          tour = true;
          tourBtn.setAttribute("aria-pressed", "true");
          beat = 0;
          scheduleTour();
          return;
        }
        tour = false;
        tourBtn.setAttribute("aria-pressed", "false");
        run = name;
        if (reduce) {
          paint(name);
          return;
        }
        if (name === "off") loopOff();
        else if (name === "work") loopWork();
        else loopIdle();
      }

      function step(dir) {
        if (run === "tour") {
          beat = (beat + dir + TOUR.length) % TOUR.length;
          scheduleTour();
          return;
        }
        const order = ["off", "idle", "work"];
        const i = order.indexOf(run);
        start(order[(i + dir + order.length) % order.length]);
      }

      for (const b of poseBtns) {
        b.addEventListener("click", () => start(b.dataset.pose));
      }

      tourBtn.addEventListener("click", () => {
        if (tour) start(poseGroup(pose));
        else start("tour");
      });
      tourBtn.setAttribute("aria-pressed", tour ? "true" : "false");

      document.addEventListener("keydown", (e) => {
        if (e.key === " ") {
          e.preventDefault();
          tourBtn.click();
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          step(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          step(-1);
        }
      });

      window.addEventListener("resize", () => {
        const sheet = cache.get(pose);
        if (sheet) show(sheet);
      });

      Promise.all(
        [
          "off",
          "off-z1",
          "off-z2",
          "idle",
          "idle-blink",
          "idle-in1",
          "idle-in2",
          "idle-hide",
          "work",
          "work-blink",
          "work-on",
          "work-dim",
          "work-logo",
          "work-tap-a",
          "work-tap-b",
          "work-tap-a-on",
          "work-tap-b-on",
        ].map(
          (name) =>
            new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => {
                const c = document.createElement("canvas");
                c.width = img.naturalWidth;
                c.height = img.naturalHeight;
                c.getContext("2d").drawImage(img, 0, 0);
                cache.set(name, c);
                resolve();
              };
              img.onerror = reject;
              img.src = `../mago/${name}.png?v=mago2`;
            }),
        ),
      ).then(() => {
        if (tour) start("tour");
        else start("off");
      });
    </script>
  </body>
</html>
