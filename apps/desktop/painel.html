<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src http://127.0.0.1:*"
    />
    <title>Nexos — painel</title>
    <link rel="stylesheet" href="painel.css" />
  </head>
  <body data-borda="topo" data-modo="recolhido" data-visao="geral">
    <!-- A janela é maior que o que aparece: o resto é transparente e deixa o clique passar (o
         processo principal liga/desliga isso pelos retângulos que esta página informa). -->
    <main class="palco" id="palco">
      <nav class="ilha" id="ilha" aria-label="Painel do Nexos">
        <!-- compacta: mago, o que está acontecendo agora e um anel por conta -->
        <div class="camada compacto" id="compacto">
          <img class="mago p" data-mago alt="" />
          <span class="c-txt" id="c-txt"></span>
          <span class="c-mais hidden" id="c-mais"></span>
          <span class="c-aneis" id="c-aneis"></span>
        </div>

        <!-- aberta: cabeçalho + uma visão por vez (geral, conta, pergunta, terminou) -->
        <div class="camada aberto" id="aberto">
          <div class="cab" id="cab">
            <button type="button" class="ico" id="b-geral" title="Conversas" aria-label="Conversas">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" /></svg>
            </button>
            <span class="cab-off hidden" id="off">Motor desligado</span>
            <span class="esp"></span>
            <button type="button" class="ico" id="b-atualizar" title="Atualizar uso das contas" aria-label="Atualizar uso das contas">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" /></svg>
            </button>
            <button type="button" class="ico" id="b-fixar" title="Manter aberto" aria-label="Manter aberto" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7" /></svg>
            </button>
            <button type="button" class="ico" id="b-nexos" title="Abrir o Nexos" aria-label="Abrir o Nexos">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4" /></svg>
            </button>
            <button type="button" class="ico" id="b-config" title="Configurações do painel" aria-label="Configurações do painel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" /></svg>
            </button>
            <button type="button" class="ico" id="b-esconder" title="Esconder o painel" aria-label="Esconder o painel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A9.6 9.6 0 0 1 12 6c5 0 8 6 8 6a14 14 0 0 1-2.4 3.1M6.5 7.9A14 14 0 0 0 4 12s3 6 8 6a8 8 0 0 0 3-.6" /></svg>
            </button>
            <button type="button" class="ico" id="b-recolher" title="Recolher" aria-label="Recolher">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
            </button>
          </div>
          <div class="visao" id="visao" aria-live="polite"></div>
          <span class="contagem" id="contagem" aria-hidden="true"></span>
        </div>
      </nav>
    </main>
    <script type="module" src="painel.js"></script>
  </body>
</html>
