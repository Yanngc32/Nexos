<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16161a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src *; manifest-src 'self'"
    />
    <title>Nexo</title>
    <link rel="manifest" href="./nexo.webmanifest" />
    <link rel="stylesheet" href="./mobile.css" />
  </head>
  <body>
    <!-- Pareamento: a primeira e única tela até haver token. -->
    <section class="tela" id="tela-par">
      <h1>Nexo</h1>
      <p class="sub">
        No computador, abra <b>Configurações → Celular</b> e peça um código. Ele vale 2 minutos.
      </p>
      <form id="form-par">
        <!--
          Sem `inputmode="numeric"`: o código tem letras. `autocapitalize` deixa
          digitar minúscula e ver maiúscula, e `autocomplete="off"` evita o
          teclado oferecer o código anterior, que já não serve.

          `maxlength` é FOLGADO de propósito, e não 6. O navegador corta pelo
          tamanho ANTES de o `limparCodigo` tirar separador: com 6, quem digita
          ou cola "AB3 K9Z" perde os dois últimos caracteres e vê um código
          incompleto sem entender por quê. Quem limita em 6 é o `limparCodigo`,
          que roda a cada tecla e conta só o que é código. Um teste trava isto.
        -->
        <input
          id="codigo"
          type="text"
          autocapitalize="characters"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          maxlength="24"
          placeholder="AB3K9Z"
          aria-label="Código de pareamento"
        />
        <button type="submit" class="primary">Conectar</button>
      </form>
      <p class="erro hidden" id="par-erro"></p>
    </section>

    <!-- App: só aparece com token. -->
    <div class="app hidden" id="app">
      <header class="topo">
        <button type="button" class="ghost" id="btn-voltar" hidden aria-label="Voltar">‹</button>
        <span class="titulo" id="titulo">Nexo</span>
        <button type="button" class="ghost" id="btn-ajustes" hidden aria-label="Modelo e esforço">⚙</button>
        <span class="pill" id="motor">…</span>
      </header>

      <main id="corpo">
        <!-- Painel: o que está acontecendo agora -->
        <section class="aba" id="aba-agora">
          <div class="cartao hidden" id="run">
            <p class="obj" id="run-obj"></p>
            <div class="linha">
              <span class="dot" id="run-dot"></span>
              <span class="quem" id="run-quem"></span>
              <span class="num" id="run-passos"></span>
              <span class="num" id="run-ms"></span>
            </div>
            <div class="barra"><i id="run-fill"></i></div>
            <p class="sub" id="run-custo"></p>
          </div>
          <div class="cartao hidden" id="contas"><div class="aneis" id="aneis"></div></div>
          <p class="vazio hidden" id="agora-vazio">Nada rodando.</p>
        </section>

        <!-- Conversas do projeto -->
        <section class="aba hidden" id="aba-conversas">
          <div class="cab-aba">
            <h2>Conversas</h2>
            <button type="button" class="primary chip" id="btn-nova">+ Nova</button>
          </div>
          <ul class="lista" id="lista-threads"></ul>
          <p class="vazio hidden" id="threads-vazio">Nenhuma conversa neste projeto.</p>
        </section>

        <!-- Uma conversa -->
        <section class="aba hidden" id="aba-chat">
          <div class="msgs" id="msgs"></div>
          <div class="slash-menu hidden" id="slash-menu"></div>
          <form class="compositor" id="form-msg">
            <textarea id="txt" rows="1" placeholder="Pergunta, pede mudança, /skill, @agente…" aria-label="Mensagem"></textarea>
            <button type="submit" class="primary" id="btn-enviar">↑</button>
          </form>
        </section>
      </main>

      <nav class="tabs" id="tabs">
        <button type="button" data-aba="agora" class="on">Agora</button>
        <button type="button" data-aba="conversas">Conversas</button>
      </nav>
    </div>

    <!-- Folha: escolher conta ou agente pra abrir conversa nova -->
    <div class="folha hidden" id="folha-nova">
      <div class="folha-fundo" data-fechar></div>
      <div class="folha-painel">
        <h3>Nova conversa</h3>
        <p class="sub" id="folha-nova-vazio">Nenhuma conta pronta. Faça login no computador.</p>
        <ul class="lista lista-folha" id="folha-nova-lista"></ul>
      </div>
    </div>

    <!-- Folha: modelo e esforço da conta desta conversa -->
    <div class="folha hidden" id="folha-ajustes">
      <div class="folha-fundo" data-fechar></div>
      <div class="folha-painel">
        <h3>Modelo e esforço</h3>
        <p class="sub" id="ajustes-conta"></p>
        <label class="campo">
          <span>Modelo</span>
          <select id="ajuste-modelo">
            <option value="">padrão do CLI</option>
            <option value="opus">opus</option>
            <option value="sonnet">sonnet</option>
            <option value="haiku">haiku</option>
            <option value="fable">fable</option>
          </select>
        </label>
        <label class="campo">
          <span>Esforço: <b id="ajuste-esforco-label">padrão</b></span>
          <input type="range" id="ajuste-esforco" min="0" max="5" step="1" />
        </label>
      </div>
    </div>

    <script type="module" src="./mobile.js"></script>
  </body>
</html>
