name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Push novo na mesma ref cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    env:
      # Nada no CI abre o Electron; sem isso o postinstall baixa ~100 MB por job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        # O daemon spawna processo e mata árvore de PID de forma diferente em
        # cada plataforma (cmd.exe, killTree), e o app é usado no Windows:
        # rodar só em Linux deixaria essa metade sem cobertura.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      # As três na major mais nova: as v4 rodavam em Node 20, que o GitHub
      # depreciou e já estava forçando pra Node 24 com aviso em todo job.
      # Prender numa major intermediária só recriaria a dívida.
      - uses: actions/checkout@v7

      # pnpm ANTES do setup-node: o `cache: pnpm` abaixo precisa do binário
      # já no PATH pra descobrir o store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
