name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Push novo na mesma ref cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    env:
      # Nada no CI abre o Electron; sem isso o postinstall baixa ~100 MB por job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        # O daemon spawna processo e mata árvore de PID de forma diferente em
        # cada plataforma (cmd.exe, killTree), e o app é usado no Windows:
        # rodar só em Linux deixaria essa metade sem cobertura.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
